query SiteMetric(
	$channelId: String!
	$interval: String!
	$rangeEnd: String
	$rangeKey: Int
	$rangeStart: String
) {
	site(
		channelId: $channelId
		interval: $interval
		rangeEnd: $rangeEnd
		rangeKey: $rangeKey
		rangeStart: $rangeStart
	) {
		sessionsMetric {
			histogram {
				metrics {
					key
					value
				}
			}
			previousValue
			trend {
				percentage
				trendClassification
			}
			value
		}
	}
}
